---
all:
  children:
    # Entrée réservée : nœud qui héberge la CA root SSH.
    # Présent par défaut pour la prod. Pour les tests sans CA définie,
    # retirer ce groupe (ou le laisser vide) et le rôle générera une CA temporaire.
    ssh_ca:
      hosts:
        ca01:
          ansible_host: 192.0.2.10
    ssh_servers:
      hosts:
        server01:
          ansible_host: 192.0.2.11
        server02:
          ansible_host: 192.0.2.12
    ssh_workstations:
      hosts:
        workstation01:
          ansible_host: 192.0.2.21

  vars:
    # Nom d'hôte (tel que déclaré ici) du nœud CA. Si vide, le rôle
    # génère une CA temporaire dédiée aux tests.
    ssh_ca_hostname: ca01
    # Utilisateurs à certifier : { name, host } où host est le poste
    # de destination du certificat (groupe ssh_workstations).
    # Options facultatives :
    #   principals       -> identités supplémentaires du certificat (-n)
    #   source_addresses -> restriction par adresse source (-O source-address=)
    ssh_users:
      - name: alice
        host: workstation01
        principals: [alice, admin]
        source_addresses: ["192.168.1.0/24"]
      - name: bob
        host: workstation01
