---
- name: Résoudre la configuration de la CA
  ansible.builtin.set_fact:
    ssh_ca_enabled: "{{ ssh_ca_hostname | length > 0 }}"
    ssh_signing_host: "{{ ssh_ca_hostname if (ssh_ca_hostname | length > 0) else 'localhost' }}"
    ssh_ca_key_path: "{{ (ssh_ca.key_dir ~ '/' ~ ssh_ca.key_name) if (ssh_ca_hostname | length > 0) else (ssh_ca_temporary.key_dir ~ '/' ~ ssh_ca.key_name) }}"
    ssh_effective_host_validity: "{{ ssh_ca_temporary.validity if not (ssh_ca_hostname | length > 0) else ssh_host_cert_validity }}"
    ssh_effective_user_validity: "{{ ssh_ca_temporary.validity if not (ssh_ca_hostname | length > 0) else ssh_user_cert_validity }}"

- name: Créer le répertoire de la clé CA
  ansible.builtin.file:
    path: "{{ ssh_ca_key_path | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: "{{ ssh_signing_host }}"
  become: "{{ ssh_ca_enabled }}"
  run_once: true

- name: Créer les répertoires de staging
  ansible.builtin.file:
    path: "{{ ssh_staging_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  delegate_to: "{{ ssh_signing_host }}"
  become: "{{ ssh_ca_enabled }}"
  run_once: true
  loop:
    - hosts
    - users

- name: Générer la paire de clés de la CA
  ansible.builtin.command: >-
    ssh-keygen -t {{ ssh_ca.key_type }} -f {{ ssh_ca_key_path }}
    -N '' -C '{{ ssh_ca.comment }}'
  args:
    creates: "{{ ssh_ca_key_path }}"
  delegate_to: "{{ ssh_signing_host }}"
  become: "{{ ssh_ca_enabled }}"
  run_once: true

- name: Lire la clé publique de la CA
  ansible.builtin.slurp:
    src: "{{ ssh_ca_key_path }}.pub"
  delegate_to: "{{ ssh_signing_host }}"
  register: _ca_pub

- name: Exposer la clé publique de la CA en fact
  ansible.builtin.set_fact:
    ssh_ca_pub_key: "{{ _ca_pub.content | b64decode }}"
