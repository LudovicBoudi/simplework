---
- name: Générer les paires de clés des CA
  ansible.builtin.command: >-
    ssh-keygen -t {{ item.key_type | default('ed25519') }} -f {{ item.key_path }}
    -N '' -C '{{ item.key_comment }}'
  args:
    creates: "{{ item.key_path }}"
  delegate_to: "{{ item.hostname }}"
  become: "{{ item.become }}"
  run_once: true
  loop: "{{ ssh_cas_worklist | default([]) }}"

- name: Lire les clés publiques des CA
  ansible.builtin.slurp:
    src: "{{ item.key_path }}.pub"
  delegate_to: "{{ item.hostname }}"
  register: _ca_pub_slurps
  run_once: true
  loop: "{{ ssh_cas_worklist | default([]) }}"

- name: Indexer les clés publiques des CA
  ansible.builtin.set_fact:
    ssh_cas_pub_index: >-
      {{ dict(_ca_pub_slurps.results | map(attribute='item') | map(attribute='name')
         | zip(_ca_pub_slurps.results | map(attribute='content') | map('b64decode') | map('trim'))) }}

- name: Exposer la clé publique de la CA par défaut
  ansible.builtin.set_fact:
    ssh_ca_pub_key: >-
      {{ ssh_cas_pub_index[ssh_ca_default.name] if ssh_cas_pub_index is defined and ssh_ca_default is defined and ssh_ca_default.name in ssh_cas_pub_index else '' }}
